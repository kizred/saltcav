[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "saltcav"
version = "0.0.1"
description = "Стохастическая модель скважинного выщелачивания соляных камер (NaCl)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
fast = ["numba>=0.59"]
stochastic = ["gstools>=1.5", "SALib>=1.4", "joblib>=1.3"]
io = ["xarray>=2024.1", "netCDF4>=1.6"]
viz = ["matplotlib>=3.8", "pyvista>=0.43"]
# FEniCSx ставится через conda-forge (см. README), здесь только Gmsh
mechanics = ["gmsh>=4.12"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[project.scripts]
saltcav = "saltcav.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/saltcav"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/saltcav"]

[[tool.mypy.overrides]]
module = ["scipy.*", "numba.*", "gstools.*", "SALib.*", "gmsh.*", "pyvista.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: долгие тесты (сходимость, бенчмарки), запускаются ночью",
    "verification: проверка против аналитики и бенчмарков",
]

[tool.coverage.run]
source = ["saltcav"]
branch = true
