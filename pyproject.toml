[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "saltcav"
version = "1.1.2"
description = "Стохастическая модель скважинного выщелачивания соляных камер (NaCl)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Sergei Kizred" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "threadpoolctl>=3.1",  # однопоточный BLAS в задачах ансамбля (память, повторяемость)
]

[project.optional-dependencies]
fast = ["numba>=0.59"]
stochastic = ["gstools>=1.5", "SALib>=1.4", "joblib>=1.3"]
io = ["xarray>=2024.1", "netCDF4>=1.6"]
viz = ["matplotlib>=3.8", "pyvista>=0.43", "imageio>=2.31", "imageio-ffmpeg>=0.5"]
# суррогат устойчивости (этап 7)
surrogate = ["scikit-learn>=1.4"]
# калибровка по данным: MAP работает без него, MCMC — emcee
calibration = ["emcee>=3.1"]
# окно просмотра результатов по шагам (saltcav view)
gui = ["saltcav[viz]", "PySide6-Essentials>=6.6", "pyvistaqt>=0.11"]  # без WebEngine и Addons
# геомеханика: сетка Gmsh + собственный осесимметричный МКЭ (NumPy/SciPy)
mechanics = [
    "gmsh>=4.12",
    "matplotlib>=3.8",
    # 3D: разложение разреженных матриц PARDISO (Intel MKL); без него 3D в десятки раз медленнее
    "pypardiso>=0.4; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "jsonschema>=4.18",
    "pre-commit>=3.7",
]

[project.scripts]
saltcav = "saltcav.cli:main"

[project.gui-scripts]
saltcav-gui = "saltcav.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/saltcav"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/saltcav"]

[[tool.mypy.overrides]]
module = [
    "scipy.*", "numba.*", "gstools.*", "SALib.*", "gmsh.*", "pyvista.*", "matplotlib.*",
    "PySide6.*", "pyvistaqt.*", "imageio.*", "pypardiso.*", "sklearn.*", "emcee.*", "vtkmodules.*", "threadpoolctl",
]
ignore_missing_imports = true

# Qt-обвязка окна: типы PySide6/pyvistaqt динамические; проверяется тестом окна
[[tool.mypy.overrides]]
module = ["saltcav.viz.viewer", "saltcav.gui.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: долгие тесты (сходимость, бенчмарки), запускаются ночью",
    "verification: проверка против аналитики и бенчмарков",
]

[tool.coverage.run]
source = ["saltcav"]
branch = true
