# Пример ансамбля: камера с прослоями и неопределённостью геологии и режима.
# Запуск: saltcav ensemble configs/example_ensemble.yaml -n 200 --jobs 0 --plot env.png
# Значения разбросов иллюстративные — уточняются по данным компании (этап 8).
name: example-ensemble

grid:
  z_top_m: 900
  z_bottom_m: 1100
  nz: 200
  nphi: 12
  r_borehole_m: 0.15

geology:
  insoluble_fraction: 0.05
  insoluble_fraction_sd: 0.02     # поле нерастворимых по (z, φ)
  bulking_factor: 1.5
  salt_density_kg_m3: 2160
  ledge_span_ratio: 3.0
  layers:
    - kind: anhydrite
      top_m: 1040
      thickness_m: 1.0
      top_sd_m: 1.5                # неопределённость отметки по ГИС
      thickness_sd_m: 0.3
    - kind: clay
      top_m: 1075
      thickness_m: 0.5
      top_sd_m: 1.0
      thickness_sd_m: 0.15

schedule:
  stages:
    - duration_days: 60
      mode: direct
      rate_m3_per_h: 50
      injection_depth_m: 1090
      production_depth_m: 1080
      blanket_depth_m: 1060
    - duration_days: 180
      mode: reverse
      rate_m3_per_h: 100
      injection_depth_m: 1040
      production_depth_m: 1090
      blanket_depth_m: 1020

uncertainty:
  k_field_sigma: 0.3              # σ ln k: поле скорости растворения
  corr_length_z_m: 10
  corr_length_phi_deg: 60
  k0_log_sd: 0.2                  # общая неопределённость закона растворения
  roof_ratio_range: [1.3, 2.0]    # по литературе (Energy, 2023)
  ledge_span_log_sd: 0.3          # критический вылет карниза
  rate_rel_sd: 0.05               # отклонения расхода по ступеням

ensemble:
  n_realizations: 200
  seed: 20261024
  sampler: lhs
