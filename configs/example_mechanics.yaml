# $schema: ../schema/saltcav-config.schema.json
# yaml-language-server: $schema=../schema/saltcav-config.schema.json
# Пример геомеханики: камера из example_ledges.yaml, затем 5 лет под рассолом и 10 лет
# хранения газа при минимальном давлении. Значения иллюстративные (соль BGRa + WIPP).
name: example-mechanics
grid:
  z_top_m: 900
  z_bottom_m: 1100
  nz: 200
  nphi: 1
  r_borehole_m: 0.15
geology:
  insoluble_fraction: 0.05
  insoluble_fraction_sd: 0.02
  bulking_factor: 1.5
  salt_density_kg_m3: 2160
  layers:
  - kind: anhydrite
    top_m: 1040.0
    thickness_m: 1.0
  - kind: clay
    top_m: 1075.0
    thickness_m: 0.5
  ledge_span_ratio: 3.0
schedule:
  stages:
  - duration_days: 60
    mode: direct
    rate_m3_per_h: 50
    injection_depth_m: 1090
    production_depth_m: 1080
    blanket_depth_m: 1060
  - duration_days: 180
    mode: reverse
    rate_m3_per_h: 100
    injection_depth_m: 1040
    production_depth_m: 1090
    blanket_depth_m: 1020
mechanics:
  h_wall_m: 1.0
  youngs_modulus_gpa: 25
  poisson: 0.25
  overburden_density_kg_m3: 2300
  surface_temperature_c: 10
  geothermal_gradient_c_per_km: 30
  creep:  # BGRa (Hunsche, Hampel, 1999)
  - a_per_day: 0.18
    n: 5
    q_kj_per_mol: 54
  stages:
  - duration_years: 5
    label: рассол
    wellhead_pressure_mpa: 0
    fluid_density_kg_m3: 1200
  - duration_years: 10
    label: газ, мин. давление
    wellhead_pressure_mpa: 6
    fluid_density_kg_m3: 100
  output_every_years: 0.5
