name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # ubuntu-latest переезжает на 26: другие имена пакетов apt
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Системные библиотеки Gmsh
        run: sudo apt-get update -q && sudo apt-get install -y -q libglu1-mesa libxcursor1 libxft2 libxinerama1 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Установка
        run: python -m pip install -e ".[dev,mechanics,gui,surrogate,calibration]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy
      - name: Тесты (без slow)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          python -X faulthandler -m pytest -m "not slow" -p no:cacheprovider -v --cov --cov-report=term-missing 2>&1 | tee pytest.log
      - name: Хвост журнала тестов при сбое
        if: failure()
        run: echo "::error title=pytest::$(tail -n 80 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
